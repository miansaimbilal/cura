<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="orbGlow1" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#C4B5FD" />
      <stop offset="40%" stop-color="#7B6FE8" />
      <stop offset="85%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </radialGradient>
    <radialGradient id="innerLight" cx="30%" cy="30%" r="40%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>
    <filter id="softBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18" result="blur" />
    </filter>
  </defs>

  <!-- Outer Ambient Aura Ring -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="#7B6FE8" stroke-width="2" opacity="0.3" stroke-dasharray="8 6" />
  <circle cx="256" cy="256" r="145" fill="#7B6FE8" opacity="0.15" filter="url(#softBlur)" />

  <!-- The Main Luminous Sanctuary Sphere -->
  <circle cx="256" cy="256" r="120" fill="url(#orbGlow1)" />

  <!-- Inner Breathing Core Ripple -->
  <circle cx="256" cy="256" r="85" fill="none" stroke="#FFFFFF" stroke-width="2.5" opacity="0.4" />
  
  <!-- Subtle Highlight Shimmer -->
  <circle cx="220" cy="220" r="70" fill="url(#innerLight)" />
  <circle cx="210" cy="210" r="14" fill="#FFFFFF" opacity="0.8" />
</svg>
