<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="archGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="60%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>
    <radialGradient id="portalSun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="40%" stop-color="#FB923C" />
      <stop offset="100%" stop-color="#7B6FE8" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="innerArch" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#151722" />
      <stop offset="100%" stop-color="#0D0E15" />
    </linearGradient>
  </defs>

  <!-- Outer Protective Arch -->
  <path d="M 136,416 L 136,256 C 136,160 190,96 256,96 C 322,96 376,160 376,256 L 376,416 Z" 
        fill="url(#archGrad)" />

  <!-- Inner Portal Chamber -->
  <path d="M 166,416 L 166,256 C 166,180 206,126 256,126 C 306,126 346,180 346,256 L 346,416 Z" 
        fill="url(#innerArch)" />

  <!-- Radiating Sunrise / Insight Core -->
  <circle cx="256" cy="270" r="90" fill="url(#portalSun)" opacity="0.85" />
  <circle cx="256" cy="270" r="32" fill="#FDE047" />
  <circle cx="256" cy="270" r="16" fill="#FFFFFF" />

  <!-- Foundation Horizon Line -->
  <line x1="100" y1="416" x2="412" y2="416" stroke="#38BDF8" stroke-width="6" stroke-linecap="round" />
</svg>
