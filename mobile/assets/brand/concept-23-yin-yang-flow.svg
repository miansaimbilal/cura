<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="yinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
    <linearGradient id="yangGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
  </defs>

  <!-- Ambient Halo -->
  <circle cx="256" cy="256" r="165" fill="#7B6FE8" opacity="0.15" />

  <!-- Yin Flow (Top Violet Swoop) -->
  <path d="M 256,96 
           A 160,160 0 0,1 256,416 
           A 80,80 0 0,1 256,256 
           A 80,80 0 0,0 256,96 Z" 
        fill="url(#yinGrad)" />

  <!-- Yang Flow (Bottom Cyan Swoop) -->
  <path d="M 256,416 
           A 160,160 0 0,1 256,96 
           A 80,80 0 0,1 256,256 
           A 80,80 0 0,0 256,416 Z" 
        fill="url(#yangGrad)" />

  <!-- Inner Complementary Insight Orbs -->
  <!-- Top Node in Yin -->
  <circle cx="256" cy="176" r="22" fill="#38BDF8" />
  <circle cx="256" cy="176" r="10" fill="#FFFFFF" />

  <!-- Bottom Node in Yang -->
  <circle cx="256" cy="336" r="22" fill="#C084FC" />
  <circle cx="256" cy="336" r="10" fill="#FFFFFF" />
</svg>
