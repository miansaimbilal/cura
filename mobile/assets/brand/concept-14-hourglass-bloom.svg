<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="hgTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC" />
      <stop offset="100%" stop-color="#7B6FE8" />
    </linearGradient>
    <linearGradient id="hgBottom" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="256" cy="256" r="140" fill="#7B6FE8" opacity="0.18" />

  <!-- Upper Vessel: Mindful Petal Curving Down -->
  <path d="M 160,110 C 210,140 230,200 256,256 C 282,200 302,140 352,110 C 302,80 210,80 160,110 Z" 
        fill="url(#hgTop)" />

  <!-- Lower Vessel: Grounded Petal Curving Up -->
  <path d="M 160,402 C 210,372 230,312 256,256 C 282,312 302,372 352,402 C 302,432 210,432 160,402 Z" 
        fill="url(#hgBottom)" />

  <!-- Side Whispering Leaves -->
  <path d="M 140,256 C 180,220 220,256 220,256 C 180,292 140,256 140,256 Z" fill="#818CF8" opacity="0.6" />
  <path d="M 372,256 C 332,220 292,256 292,256 C 332,292 372,256 372,256 Z" fill="#38BDF8" opacity="0.6" />

  <!-- The Present Moment Core (Focal Spark at Waist) -->
  <circle cx="256" cy="256" r="16" fill="#FFFFFF" />
  <circle cx="256" cy="256" r="28" fill="#FFFFFF" opacity="0.25" />
</svg>
