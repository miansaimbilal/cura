<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="leafGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E1B4B" />
      <stop offset="40%" stop-color="#4F46E5" />
      <stop offset="80%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>
    <filter id="neuralGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient Backdrop Glow -->
  <circle cx="256" cy="256" r="160" fill="#4F46E5" opacity="0.15" />

  <!-- The Neural Leaf Outer Contour -->
  <path d="M 140,372 C 110,250 200,120 372,140 C 402,262 312,392 140,372 Z" 
        fill="none" stroke="url(#leafGrad)" stroke-width="14" stroke-linecap="round" />

  <!-- Neural Spine / Midrib -->
  <path d="M 155,357 C 220,290 280,230 357,155" 
        stroke="#38BDF8" stroke-width="8" stroke-linecap="round" fill="none" />

  <!-- Neural Lateral Synaptic Branches -->
  <line x1="220" y1="292" x2="175" y2="235" stroke="#818CF8" stroke-width="5" stroke-linecap="round" />
  <line x1="220" y1="292" x2="270" y2="340" stroke="#818CF8" stroke-width="5" stroke-linecap="round" />
  <line x1="285" y1="227" x2="235" y2="170" stroke="#38BDF8" stroke-width="5" stroke-linecap="round" />
  <line x1="285" y1="227" x2="340" y2="275" stroke="#38BDF8" stroke-width="5" stroke-linecap="round" />

  <!-- Synaptic Nodes (Glowing Data Orbs) -->
  <circle cx="175" cy="235" r="9" fill="#34D399" filter="url(#neuralGlow)" />
  <circle cx="270" cy="340" r="9" fill="#34D399" filter="url(#neuralGlow)" />
  <circle cx="235" cy="170" r="10" fill="#38BDF8" filter="url(#neuralGlow)" />
  <circle cx="340" cy="275" r="10" fill="#38BDF8" filter="url(#neuralGlow)" />
  
  <!-- Central Awakening Cortex -->
  <circle cx="256" cy="256" r="14" fill="#FFFFFF" />
  <circle cx="372" cy="140" r="12" fill="#34D399" />
</svg>
