<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="spiralGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="35%" stop-color="#7B6FE8" />
      <stop offset="70%" stop-color="#C084FC" />
      <stop offset="100%" stop-color="#FDE047" />
    </linearGradient>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="280" cy="270" r="140" fill="#7B6FE8" opacity="0.18" />

  <!-- Smooth Fibonacci Logarithmic Golden Spiral Curve -->
  <path d="M 120,380 
           C 60,260 120,130 256,110 
           C 370,95 425,180 415,280 
           C 405,360 330,400 270,385 
           C 220,370 200,310 220,270 
           C 235,240 270,230 290,250 
           C 300,260 300,280 285,285" 
        fill="none" 
        stroke="url(#spiralGrad)" 
        stroke-width="20" 
        stroke-linecap="round" />

  <!-- The Golden Core Star at Center -->
  <g transform="translate(285, 275)">
    <path d="M 0,-18 Q 0,0 18,0 Q 0,0 0,18 Q 0,0 -18,0 Q 0,0 0,-18 Z" fill="#FDE047" />
    <circle cx="0" cy="0" r="4" fill="#FFFFFF" />
  </g>

  <!-- External Marker Droplet -->
  <circle cx="120" cy="380" r="10" fill="#38BDF8" />
</svg>
