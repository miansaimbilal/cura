<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="ringUser" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>
    <linearGradient id="ringAI" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC" />
      <stop offset="100%" stop-color="#7B6FE8" />
    </linearGradient>
    <filter id="harmonyGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <g transform="rotate(-15 256 256)">
    <!-- Back of Ring 2 (AI - Violet) -->
    <ellipse cx="290" cy="256" rx="130" ry="85" 
             fill="none" stroke="url(#ringAI)" stroke-width="28" 
             stroke-dasharray="350 350" stroke-dashoffset="175" />

    <!-- Full Ring 1 (User - Cyan/Green) -->
    <ellipse cx="220" cy="256" rx="130" ry="85" 
             fill="none" stroke="url(#ringUser)" stroke-width="28" 
             filter="url(#harmonyGlow)" />

    <!-- Front of Ring 2 (AI - Violet) overlapping Ring 1 -->
    <ellipse cx="290" cy="256" rx="130" ry="85" 
             fill="none" stroke="url(#ringAI)" stroke-width="28" 
             stroke-dasharray="350 350" stroke-dashoffset="0" />
             
    <!-- Connection Point Star / Spark -->
    <circle cx="255" cy="210" r="14" fill="#FFFFFF" />
    <circle cx="255" cy="210" r="24" fill="#FFFFFF" opacity="0.3" />
  </g>
</svg>
