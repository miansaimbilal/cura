<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="stone1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A78BFA" />
      <stop offset="100%" stop-color="#6D28D9" />
    </linearGradient>
    <linearGradient id="stone2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>
    <linearGradient id="stone3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <radialGradient id="zenGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7B6FE8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#7B6FE8" stop-opacity="0" />
    </radialGradient>
  </defs>

  <circle cx="256" cy="270" r="170" fill="url(#zenGlow)" />

  <!-- Base Stone -->
  <ellipse cx="256" cy="370" rx="140" ry="46" fill="url(#stone1)" />
  <ellipse cx="230" cy="360" rx="90" ry="20" fill="#FFFFFF" opacity="0.12" />

  <!-- Middle Stone -->
  <ellipse cx="256" cy="280" rx="105" ry="38" fill="url(#stone2)" />
  <ellipse cx="235" cy="272" rx="70" ry="16" fill="#FFFFFF" opacity="0.15" />

  <!-- Top Balancing Stone -->
  <ellipse cx="256" cy="195" rx="72" ry="30" fill="url(#stone3)" />
  <ellipse cx="242" cy="188" rx="46" ry="12" fill="#FFFFFF" opacity="0.2" />

  <!-- Floating Zenith Spark of Insight -->
  <g transform="translate(256, 115)">
    <path d="M 0,-24 Q 0,0 24,0 Q 0,0 0,24 Q 0,0 -24,0 Q 0,0 0,-24 Z" fill="#FFFFFF" />
    <circle cx="0" cy="0" r="4" fill="#7B6FE8" />
  </g>
</svg>
