<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="aurora1" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0" />
      <stop offset="60%" stop-color="#34D399" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="aurora2" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0" />
      <stop offset="50%" stop-color="#7B6FE8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#C084FC" stop-opacity="0.9" />
    </linearGradient>
  </defs>

  <!-- Circular Mask/Container -->
  <circle cx="256" cy="256" r="160" fill="#090A0F" stroke="#25293C" stroke-width="4" />

  <!-- Aurora Wave Curtain 1 (Emerald/Cyan) -->
  <path d="M 110,340 C 150,260 190,300 240,240 C 290,180 340,230 400,160 L 400,380 L 110,380 Z" 
        fill="url(#aurora1)" />

  <!-- Aurora Wave Curtain 2 (Cyan/Violet) -->
  <path d="M 120,310 C 180,210 220,270 280,180 C 330,120 370,160 395,110 L 395,360 L 120,360 Z" 
        fill="url(#aurora2)" />

  <!-- Mountain Silhouette Base -->
  <polygon points="120,370 210,300 270,350 330,290 400,370" fill="#0D0E15" />

  <!-- Solitary Guiding Star in Aurora Sky -->
  <circle cx="210" cy="150" r="5" fill="#FFFFFF" />
  <circle cx="210" cy="150" r="12" fill="#FFFFFF" opacity="0.4" />
  <circle cx="310" cy="120" r="3" fill="#FFFFFF" opacity="0.8" />
</svg>
