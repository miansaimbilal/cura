<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="armLeft" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#7B6FE8" />
    </linearGradient>
    <linearGradient id="armRight" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#F472B6" />
      <stop offset="100%" stop-color="#A78BFA" />
    </linearGradient>
    <radialGradient id="heartSparkGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#F472B6" />
      <stop offset="100%" stop-color="#7B6FE8" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Ambient Light -->
  <circle cx="256" cy="240" r="140" fill="#7B6FE8" opacity="0.15" />

  <!-- Left Cupping Wing / Arm -->
  <path d="M 160,370 C 100,310 90,200 180,140 C 220,110 240,150 210,180 C 150,230 160,300 230,330 Z" 
        fill="url(#armLeft)" />

  <!-- Right Cupping Wing / Arm -->
  <path d="M 352,370 C 412,310 422,200 332,140 C 292,110 272,150 302,180 C 362,230 352,300 282,330 Z" 
        fill="url(#armRight)" />

  <!-- The Protected Companion Spark Core (Heart-Star Metaphor) -->
  <g transform="translate(256, 235)">
    <circle cx="0" cy="0" r="45" fill="url(#heartSparkGlow)" opacity="0.8" />
    <path d="M 0,-30 Q 0,0 30,0 Q 0,0 0,30 Q 0,0 -30,0 Q 0,0 0,-30 Z" fill="#FFFFFF" />
    <circle cx="0" cy="0" r="8" fill="#F472B6" />
  </g>
</svg>
