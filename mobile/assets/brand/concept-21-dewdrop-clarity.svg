<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="stemGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="60%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <radialGradient id="dewDrop" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="45%" stop-color="#93C5FD" />
      <stop offset="85%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </radialGradient>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="270" cy="230" r="130" fill="#38BDF8" opacity="0.18" />

  <!-- Elegant Curving Stem Arc -->
  <path d="M 120,400 C 140,280 220,180 370,160" 
        fill="none" stroke="url(#stemGrad)" stroke-width="16" stroke-linecap="round" />

  <!-- The Balanced Morning Dewdrop (Teardrop Sphere) -->
  <circle cx="270" cy="220" r="82" fill="url(#dewDrop)" />

  <!-- Crisp Light Highlight -->
  <ellipse cx="242" cy="190" rx="26" ry="14" transform="rotate(-30 242 190)" fill="#FFFFFF" opacity="0.85" />
  <circle cx="285" cy="260" r="10" fill="#FFFFFF" opacity="0.4" />
</svg>
