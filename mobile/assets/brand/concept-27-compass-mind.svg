<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="northPoint" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#7B6FE8" />
    </linearGradient>
    <linearGradient id="southPoint" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>
    <linearGradient id="ringCompass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC" />
      <stop offset="50%" stop-color="#7B6FE8" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
  </defs>

  <!-- Ambient Compass Glow -->
  <circle cx="256" cy="256" r="160" fill="#7B6FE8" opacity="0.12" />

  <!-- Outer Rounded Calibration Ring -->
  <circle cx="256" cy="256" r="150" fill="none" stroke="url(#ringCompass)" stroke-width="8" />
  
  <!-- Cardinal Tick Notches -->
  <line x1="256" y1="94" x2="256" y2="114" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" />
  <line x1="418" y1="256" x2="398" y2="256" stroke="#38BDF8" stroke-width="4" stroke-linecap="round" />
  <line x1="256" y1="418" x2="256" y2="398" stroke="#7B6FE8" stroke-width="4" stroke-linecap="round" />
  <line x1="94" y1="256" x2="114" y2="256" stroke="#C084FC" stroke-width="4" stroke-linecap="round" />

  <!-- North Needle Facet -->
  <polygon points="256,120 286,256 256,236" fill="url(#northPoint)" />
  <polygon points="256,120 226,256 256,236" fill="#FFFFFF" opacity="0.9" />

  <!-- South Needle Facet -->
  <polygon points="256,392 286,256 256,276" fill="url(#southPoint)" />
  <polygon points="256,392 226,256 256,276" fill="#312E81" />

  <!-- Center Pivot Jewel -->
  <circle cx="256" cy="256" r="18" fill="#151722" stroke="#FFFFFF" stroke-width="4" />
  <circle cx="256" cy="256" r="6" fill="#38BDF8" />
</svg>
