<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="flameOuter" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="40%" stop-color="#7B6FE8" />
      <stop offset="75%" stop-color="#FB923C" />
      <stop offset="100%" stop-color="#FDE047" />
    </linearGradient>
    <linearGradient id="flameInner" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#FB923C" />
      <stop offset="50%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>
    <radialGradient id="hearthGlow" cx="50%" cy="60%" r="50%">
      <stop offset="0%" stop-color="#FB923C" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#7B6FE8" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#0D0E15" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Ambient Hearth Glow -->
  <circle cx="256" cy="280" r="170" fill="url(#hearthGlow)" />

  <!-- Outer Flame Teardrop Contour -->
  <path d="M 256,90 
           C 256,90 370,220 370,300 
           C 370,364 319,416 256,416 
           C 193,416 142,364 142,300 
           C 142,220 256,90 256,90 Z" 
        fill="url(#flameOuter)" />

  <!-- Inner Dancing Heart Core Flame -->
  <path d="M 256,200 
           C 256,200 320,270 320,320 
           C 320,355 291,384 256,384 
           C 221,384 192,355 192,320 
           C 192,270 256,200 256,200 Z" 
        fill="url(#flameInner)" />

  <!-- Luminous White Spark Nucleus -->
  <circle cx="256" cy="320" r="14" fill="#FFFFFF" />
  <circle cx="256" cy="320" r="26" fill="#FFFFFF" opacity="0.3" />
</svg>
