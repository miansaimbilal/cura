<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <linearGradient id="dropGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#C7D2FE" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="256" cy="256" r="150" fill="#6366F1" opacity="0.2" />

  <!-- Shield Shape (Smooth Modern Reuleaux Style) -->
  <path d="M 256,90 
           C 360,90 410,150 410,260 
           C 410,360 310,410 256,440 
           C 202,410 102,360 102,260 
           C 102,150 152,90 256,90 Z" 
        fill="url(#shieldGrad)" />

  <!-- Inner Recessed Well -->
  <path d="M 256,120 
           C 336,120 376,170 376,256 
           C 376,338 298,380 256,406 
           C 214,380 136,338 136,256 
           C 136,170 176,120 256,120 Z" 
        fill="#151722" />

  <!-- Inner Calm Teardrop Droplet -->
  <path d="M 256,190 
           C 256,190 310,270 310,300 
           C 310,330 286,354 256,354 
           C 226,354 202,330 202,300 
           C 202,270 256,190 256,190 Z" 
        fill="url(#dropGrad)" />

  <circle cx="242" cy="290" r="8" fill="#FFFFFF" opacity="0.8" />
</svg>
