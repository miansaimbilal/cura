<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bfUpperLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC" />
      <stop offset="100%" stop-color="#7B6FE8" />
    </linearGradient>
    <linearGradient id="bfUpperRight" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
    <linearGradient id="bfLowerLeft" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F472B6" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>
    <linearGradient id="bfLowerRight" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="256" cy="256" r="150" fill="#7B6FE8" opacity="0.15" />

  <!-- Upper Left Wing Facets -->
  <polygon points="256,230 110,130 170,260" fill="url(#bfUpperLeft)" />
  <polygon points="256,230 170,260 210,280" fill="#9333EA" opacity="0.8" />

  <!-- Upper Right Wing Facets -->
  <polygon points="256,230 402,130 342,260" fill="url(#bfUpperRight)" />
  <polygon points="256,230 342,260 302,280" fill="#4338CA" opacity="0.8" />

  <!-- Lower Left Wing -->
  <polygon points="256,280 160,300 200,390" fill="url(#bfLowerLeft)" />
  <polygon points="256,280 200,390 256,340" fill="#BE185D" opacity="0.75" />

  <!-- Lower Right Wing -->
  <polygon points="256,280 352,300 312,390" fill="url(#bfLowerRight)" />
  <polygon points="256,280 312,390 256,340" fill="#047857" opacity="0.75" />

  <!-- Center Slender Body & Antennae -->
  <ellipse cx="256" cy="265" rx="8" ry="46" fill="#FFFFFF" />
  <circle cx="256" cy="205" r="10" fill="#FFFFFF" />
  <circle cx="236" cy="175" r="5" fill="#C084FC" />
  <circle cx="276" cy="175" r="5" fill="#38BDF8" />
</svg>
