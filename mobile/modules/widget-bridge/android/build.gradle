plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.cura.app.widgetbridge'
version = '1.0.0'

expoModule {
  v2 true
}

android {
  namespace "expo.modules.widgetbridge"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
}

dependencies {
  implementation "androidx.core:core-ktx:1.15.0"
}
